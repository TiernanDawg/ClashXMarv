name: VanguardArena
options:
  bundleIdPrefix: com.tiernan.vanguardarena
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGNING_ALLOWED: NO
targets:
  VanguardArena:
    type: application
    platform: iOS
    sources:
      - path: VanguardArena
        excludes:
          - Info.plist
    info:
      path: VanguardArena/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernan.vanguardarena
        PRODUCT_NAME: VanguardArena
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  VanguardArenaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: VanguardArena
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiernan.vanguardarena.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VanguardArena.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VanguardArena"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  VanguardArena:
    build:
      targets:
        VanguardArena: all
        VanguardArenaTests: [test]
    test:
      config: Debug
      targets:
        - VanguardArenaTests
