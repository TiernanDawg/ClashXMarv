name: Validate and Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Expo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run mechanics tests
        run: npm test
      - name: Export iOS JavaScript bundle
        run: npx expo export --platform ios

  build-ipa:
    name: Build unsigned iOS IPA (free macOS runner)
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: npx pod-install
      - name: Build iOS device app without Apple signing
        run: |
          xcodebuild \
            -workspace ios/ClashXMarv.xcworkspace \
            -scheme ClashXMarv \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/ClashXMarv.app"
          test -d "$APP_PATH" || { echo "Built app not found at $APP_PATH"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/ClashXMarv.app
          cd build/ipa
          /usr/bin/zip -qry ../../ClashXMarv-unsigned.ipa Payload
          cd ../..
          test -s ClashXMarv-unsigned.ipa
          ls -lh ClashXMarv-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashXMarv-unsigned-IPA
          path: ClashXMarv-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
