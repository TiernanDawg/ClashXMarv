name: Vanguard Arena CI
'on':
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    name: Lint tests simulation audio and Expo export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Headless bot balance benchmark
        run: MATCHES=100 npm run simulate
      - name: Generate and verify procedural audio
        run: npm run audio:verify
      - run: npx expo export --platform ios
  build-ipa:
    name: Build unsigned iOS IPA
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - run: npx pod-install
      - name: Build iOS device app without Apple signing
        run: |
          xcodebuild -workspace ios/VanguardArena.xcworkspace -scheme VanguardArena -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/Build/Products/Release-iphoneos/VanguardArena.app"
          test -d "$APP_PATH" || { echo "Built app not found at $APP_PATH"; exit 1; }
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/VanguardArena.app
          cd build/ipa
          /usr/bin/zip -qry ../../Vanguard-Arena.ipa Payload
          cd ../..
          test -s Vanguard-Arena.ipa
          ls -lh Vanguard-Arena.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Vanguard-Arena
          path: Vanguard-Arena.ipa
          if-no-files-found: error
          retention-days: 14
